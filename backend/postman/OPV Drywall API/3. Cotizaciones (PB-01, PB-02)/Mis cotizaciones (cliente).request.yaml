$kind: http-request
url: "{{baseUrl}}/cotizaciones/mias"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenCliente}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("es arreglo", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 4000
