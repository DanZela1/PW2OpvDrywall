$kind: http-request
url: "{{baseUrl}}/servicios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "X",
      "descripcion": "x",
      "categoria": "y"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
