$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Temporal",
      "correo": "tmp{{uid}}@mail.com",
      "password": "123456",
      "rol": "cliente"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("uid", Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("usuarioId", pm.response.json().id);
      pm.test("sin passwordHash", () => pm.expect(pm.response.json()).to.not.have.property("passwordHash"));
    language: text/javascript
order: 1000
