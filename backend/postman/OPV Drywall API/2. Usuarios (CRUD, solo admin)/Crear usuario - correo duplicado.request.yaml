$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Dup",
      "correo": "admin@opvdrywall.com",
      "password": "123456"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
