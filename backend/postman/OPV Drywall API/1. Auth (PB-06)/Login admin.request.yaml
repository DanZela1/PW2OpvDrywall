$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo": "admin@opvdrywall.com",
      "password": "Admin123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("rol admin", () => pm.expect(pm.response.json().usuario.rol).to.eql("admin"));
      pm.collectionVariables.set("tokenAdmin", pm.response.json().token);
    language: text/javascript
order: 5000
