$kind: http-request
url: "{{baseUrl}}/postulaciones?estado=nueva"
method: GET
queryParams:
  estado: nueva
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
