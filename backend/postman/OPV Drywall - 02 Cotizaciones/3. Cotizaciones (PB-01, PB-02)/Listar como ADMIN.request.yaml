$kind: http-request
url: "{{baseUrl}}/cotizaciones?pagina=1&limite=5"
method: GET
queryParams:
  pagina: "1"
  limite: "5"
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("respuesta paginada", () => pm.expect(pm.response.json().datos).to.be.an("array"));
    language: text/javascript
order: 7000
