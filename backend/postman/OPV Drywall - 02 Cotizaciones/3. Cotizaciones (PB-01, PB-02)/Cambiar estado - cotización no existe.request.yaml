$kind: http-request
url: "{{baseUrl}}/cotizaciones/999999/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "enviada"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 15000
