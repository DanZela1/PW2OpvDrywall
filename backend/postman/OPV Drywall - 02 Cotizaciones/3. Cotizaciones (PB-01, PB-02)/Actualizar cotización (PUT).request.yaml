$kind: http-request
url: "{{baseUrl}}/cotizaciones/{{cotizacionId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ubicacion": "San Pedro Sula"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("ubicación actualizada", () => pm.expect(pm.response.json().ubicacion).to.eql("San Pedro Sula"));
    language: text/javascript
order: 12000
