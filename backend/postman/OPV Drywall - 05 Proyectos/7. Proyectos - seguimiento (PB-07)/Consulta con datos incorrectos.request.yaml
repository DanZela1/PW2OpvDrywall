$kind: http-request
url: "{{baseUrl}}/proyectos/consulta"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo": "otro@mail.com",
      "codigo": "{{proyectoCodigo}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 6000
