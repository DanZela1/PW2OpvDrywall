$kind: http-request
url: "{{baseUrl}}/contacto/{{contactoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "leido": true
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("leido=true", () => pm.expect(pm.response.json().leido).to.eql(true));
    language: text/javascript
order: 6000
