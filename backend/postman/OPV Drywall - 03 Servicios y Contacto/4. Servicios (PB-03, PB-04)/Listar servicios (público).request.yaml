$kind: http-request
url: "{{baseUrl}}/servicios"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("incluye los 6 del seed", () => pm.expect(pm.response.json().total).to.be.at.least(6));
    language: text/javascript
order: 1000
