$kind: http-request
url: "{{baseUrl}}/servicios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "X",
      "descripcion": "x",
      "categoria": "y"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenCliente}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
