$kind: http-request
url: "{{baseUrl}}/servicios/{{servicioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "activo": false
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("activo=false", () => pm.expect(pm.response.json().activo).to.eql(false));
    language: text/javascript
order: 8000
