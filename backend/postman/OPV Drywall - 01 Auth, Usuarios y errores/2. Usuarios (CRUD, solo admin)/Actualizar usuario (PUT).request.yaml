$kind: http-request
url: "{{baseUrl}}/usuarios/{{usuarioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Temporal Editado"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("nombre actualizado", () => pm.expect(pm.response.json().nombre).to.eql("Temporal Editado"));
    language: text/javascript
order: 10000
